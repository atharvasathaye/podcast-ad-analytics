name: Daily Pipeline

on:
  schedule:
    - cron: '0 8 * * *' # 8 AM UTC daily
  workflow_dispatch: # allow manual trigger

jobs:
  daily_run:
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Auth to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Run Ingestion
        run: |
          pip install -r ingestion/requirements.txt
          python ingestion/extract_itunes.py
          python ingestion/generate_events.py
          python ingestion/load_to_bq.py

      - name: Run dbt
        run: |
          pip install dbt-bigquery==1.7.0
          cd dbt_project
          dbt deps
          dbt build
          dbt snapshot

      - name: Run Forecast
        run: |
          pip install -r forecasting/requirements.txt
          python forecasting/forecast_revenue.py
