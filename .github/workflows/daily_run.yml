name: Daily Pipeline

on:
  schedule:
    - cron: '0 8 * * *' # 8 AM UTC daily
  workflow_dispatch: # allow manual trigger

jobs:
  daily_run:
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check GCP Credentials
        id: check_creds
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          if [ -z "$GCP_CREDS" ]; then
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice title=GCP Credentials Not Configured::GCP_CREDENTIALS secret is not configured in repository settings. Running synthetic generation in offline validation mode."
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

      - name: Auth to GCP
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Run Ingestion (Live GCP)
        if: steps.check_creds.outputs.has_creds == 'true'
        run: |
          pip install -r ingestion/requirements.txt
          python ingestion/extract_itunes.py
          python ingestion/generate_events.py
          python ingestion/load_to_bq.py

      - name: Run Ingestion (Offline Validation)
        if: steps.check_creds.outputs.has_creds != 'true'
        run: |
          pip install -r ingestion/requirements.txt
          python ingestion/extract_itunes.py
          python ingestion/generate_events.py

      - name: Run dbt
        if: steps.check_creds.outputs.has_creds == 'true'
        run: |
          pip install dbt-bigquery==1.7.0
          cd dbt_project
          dbt deps
          dbt build
          dbt snapshot

      - name: Run Forecast
        if: steps.check_creds.outputs.has_creds == 'true'
        run: |
          pip install -r forecasting/requirements.txt
          python forecasting/forecast_revenue.py
