name: dbt Slim CI

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'dbt_project/**'
  workflow_dispatch:

jobs:
  dbt_ci:
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check GCP Credentials
        id: check_creds
        env:
          GCP_CREDS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          if [ -z "$GCP_CREDS" ]; then
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice title=GCP Credentials Not Configured::GCP_CREDENTIALS secret is not configured. Skipping BigQuery connection."
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check_creds.outputs.has_creds == 'true'
        run: |
          pip install dbt-bigquery==1.7.0

      - name: Auth to GCP
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Run dbt deps
        if: steps.check_creds.outputs.has_creds == 'true'
        run: dbt deps
        working-directory: ./dbt_project

      - name: Run dbt build (state modified)
        if: steps.check_creds.outputs.has_creds == 'true'
        run: dbt build --select state:modified+ --defer --state ./target
        working-directory: ./dbt_project
